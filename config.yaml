# Runtime configuration. CLI flags override these values.

audio:
  source: mic              # mic | system | both
  mic_device: null         # null = system default; or an index / name substring (see `openinterview devices`)
  system_backend: auto     # auto (process tap, else BlackHole) | tap | blackhole
  blackhole_device: BlackHole
  sample_rate: 16000       # ASR rate; capture is resampled to this
  ring_buffer_seconds: 30  # per-source history kept in memory (bounded)

asr:
  # Default chosen from bench/results (Apple M2): best technical-term accuracy at ~1 s finals.
  # base.en: ~half the memory, ~0.2 s faster finals, ~2x the errors. apple: tiny memory
  # footprint, runs on the Neural Engine, but weak on jargon. See README "Benchmarks".
  model: small.en          # tiny.en | base.en | small.en | large-v3-turbo | parakeet-v2 | parakeet-v3 | apple
  language: en
  # Domain terms that bias Whisper decoding toward the right spelling (Whisper only).
  vocabulary_prompt: "Python, GIL, asyncio, Kubernetes, PostgreSQL, Redis, REST API, gRPC, idempotent, O(n log n)."
  prompt_with_context: true  # also prompt with the tail of the previous sentence

pipeline:
  vad: silero              # silero (ONNX) | energy (RMS fallback)
  vad_threshold: 0.5
  min_silence_s: 0.6       # silence that ends a segment -> final transcript
  max_segment_s: 15.0      # hard cap; long speech is cut at the quietest frame
  partial_interval_s: 1.0  # re-transcribe the open segment this often for live partials
  # Overload policy: finals are FIFO and only dropped (oldest first) beyond max_finals.
  # While degrade_at finals are pending, partials are skipped so finals catch up.
  max_finals: 8
  degrade_at: 2
  merge_gap_s: 1.2         # finals without end punctuation merge into one utterance within this gap
  echo_suppression: true   # in "both" mode, drop mic speech that is the speakers' system audio

storage:
  save_transcripts: false  # audio is never written to disk
  transcript_dir: transcripts

assistant:
  # Optional practice assistant. Disabled by default; ASR works without it.
  # Needs a running `opencode serve --port 4096` (see README) or an OpenAI-compatible server.
  enabled: false
  provider: opencode        # opencode | openai
  base_url: http://127.0.0.1:4096   # openai provider: e.g. http://127.0.0.1:11434/v1
  model: opencode-go/deepseek-v4.1-flash  # "providerID/modelID" (null = OpenCode default); list: opencode models
  api_key_env: OPENAI_API_KEY  # openai provider only: the key is read from this env var
  mode: immediate           # immediate (answers show automatically) | practice (reveal by hand)
  listen_to: [auto]         # whose sentences may be questions: auto = "Them" when system audio
                            # is captured, "Me" in mic-only practice; or e.g. [system, mic]
  require_technical: true   # ignore small talk like "How are you today?"
  timeout_s: 60
