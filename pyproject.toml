[project]
name = "openinterview"
version = "0.1.0"
description = "Local real-time speech recognition assistant for macOS (Apple Silicon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "soxr>=0.5",
    "pyyaml>=6.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
parakeet = ["parakeet-mlx>=0.5"]

[project.scripts]
openinterview = "openinterview.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openinterview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# mlx-whisper declares torch only for its weight-conversion script; it is never imported
# at runtime. Excluding it saves ~500 MB of disk.
override-dependencies = ["torch; sys_platform == 'never'"]
